; ═══════════════════════════════════════════════════════════
;  AVR Asterisk — PJSIP configuration
;  ViciDial (46.225.136.17) → this Asterisk → AudioSocket → avr-core → Vapi
; ═══════════════════════════════════════════════════════════

; ── Transport ─────────────────────────────────────────────
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

; ── ViciDial trunk (inbound SIP from 46.225.136.17) ───────
[vicidial-trunk]
type=endpoint
context=from-vicidial
disallow=all
allow=ulaw
allow=alaw
dtmf_mode=rfc4733
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
aors=vicidial-aor

[vicidial-aor]
type=aor
contact=sip:46.225.136.17:5060
max_contacts=10

[vicidial-identify]
type=identify
endpoint=vicidial-trunk
match=46.225.136.17
