; ═══════════════════════════════════════════════════════════
;  AVR Asterisk — AMI configuration
;  avr-ami service connects here to manage local call legs
; ═══════════════════════════════════════════════════════════

[general]
enabled=yes
port=5038
bindaddr=0.0.0.0

; avr-ami service account
[avr-ami]
secret=avr-ami-2026          ; must match AVR_ASTERISK_AMI_SECRET in .env
deny=0.0.0.0/0.0.0.0
permit=127.0.0.1/255.255.255.0
permit=172.16.0.0/255.240.0.0  ; Docker internal network
read=all
write=all
