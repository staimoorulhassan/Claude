; ═══════════════════════════════════════════════════════════
;  AVR Asterisk — Dialplan
;
;  Flow:
;    ViciDial bridges answered call → [from-vicidial]
;    → assign UUID → AudioSocket → avr-core → Vapi (STT/LLM/TTS)
;    → on qualify: avr-app → avr-ami → ViciDial AMI → 3-way verifier
;    → Savannah confirms → avr drops → ViciDial holds bridge
; ═══════════════════════════════════════════════════════════

[from-vicidial]
; Entry point for all calls coming from ViciDial (46.225.136.17)
exten => _X.,1,NoOp(ViciDial call in: ${CALLERID(num)} → ${EXTEN})
 same => n,Answer()
 same => n,Wait(0.5)
 ; Assign a UUID so avr-ami can address this channel for transfer
 same => n,Set(CALL_UUID=${UNIQUEID})
 same => n,Set(CHANNEL(setvar)=CALL_UUID=${CALL_UUID})
 ; Route to AudioSocket — avr-core listens on port 9093
 same => n,AGI(agi://avr-core:9093,${CALL_UUID})
 same => n,Hangup()

exten => h,1,NoOp(Call ended: ${CALL_UUID})

; ── Internal: drop this call leg (called by avr-ami after verifier bridges in)
[avr-drop-call]
exten => drop,1,NoOp(Dropping AVR leg ${CALL_UUID})
 same => n,Hangup()
