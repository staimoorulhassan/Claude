; ─── Lead-gen campaign dialplan ──────────────────────────────────────────────
;
; Call flow:
;   1. ViciDial dials lead → Asterisk bridges the answered call to Vapi SIP URI
;      (vapi-trunk-endpoint). Vapi's Savannah agent runs the qualification.
;   2. On eligibility, Vapi fires a webhook → vapi-control → POST avr-ami:6006/transfer
;      with the CALL_UUID → Asterisk bridges lead to [verifier-transfer] context.
;   3. Verifier's avr-phone rings → 3-way bridge complete → agent drops.

[general]
static=yes
writeprotect=no

; ─── Inbound from ViciDial (calls routed through vapi-trunk-endpoint) ─────────
[vapi-inbound]
; Assign UUID before bridging to Vapi so avr-ami can address this channel
exten => _X.,1,Set(CALL_UUID=${UNIQUEID})
exten => _X.,n,Set(__CALL_UUID=${CALL_UUID})
exten => _X.,n,Dial(PJSIP/${EXTEN}@vapi-trunk-endpoint,,b(set-uuid^s^1))
exten => _X.,n,Hangup()

; ─── Macro/pre-dial: pass UUID as SIP header so Vapi can echo it back ─────────
[set-uuid]
exten => s,1,SIPAddHeader(X-Call-UUID: ${CALL_UUID})
exten => s,n,Return()

; ─── Transfer target: avr-ami /transfer sends the call here ───────────────────
[verifier-transfer]
; Dial the verifier's avr-phone WebRTC endpoint
exten => verifier,1,Answer()
exten => verifier,n,Dial(PJSIP/verifier,,tT)   ; tT = allow both parties to transfer
exten => verifier,n,Hangup()

; ─── Verifier's inbound context (avr-phone) ───────────────────────────────────
[verifier-inbound]
exten => _X.,1,Answer()
exten => _X.,n,Wait(1)
exten => _X.,n,Hangup()
