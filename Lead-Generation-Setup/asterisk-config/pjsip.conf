; ─── PJSIP transport ─────────────────────────────────────────────────────────
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8088
; The avr-phone browser softphone connects over WSS

; ─── Vapi SIP trunk (outbound: ViciDial bridges here → Vapi assistant) ───────
[vapi-trunk]
type=registration
transport=transport-udp
outbound_auth=vapi-trunk-auth
server_uri=sip:sip.vapi.ai
client_uri=sip:CHANGE_ME@sip.vapi.ai   ; match your VAPI_SIP_URI username
retry_interval=60

[vapi-trunk-auth]
type=auth
auth_type=userpass
username=CHANGE_ME                      ; Vapi BYO SIP trunk username (if auth required)
password=CHANGE_ME                      ; Vapi BYO SIP trunk password

[vapi-trunk-aor]
type=aor
contact=sip:sip.vapi.ai

[vapi-trunk-endpoint]
type=endpoint
transport=transport-udp
aors=vapi-trunk-aor
outbound_auth=vapi-trunk-auth
context=vapi-inbound
allow=ulaw
allow=alaw

; ─── Verifier endpoint (avr-phone browser softphone) ─────────────────────────
[verifier]
type=endpoint
transport=transport-wss
aors=verifier-aor
auth=verifier-auth
context=verifier-inbound
allow=ulaw
allow=alaw
dtls_auto_generate_cert=yes
media_encryption=dtls
ice_support=yes

[verifier-auth]
type=auth
auth_type=userpass
username=verifier
password=CHANGE_ME_VERIFIER_PASS       ; set this and enter it in avr-phone browser UI

[verifier-aor]
type=aor
max_contacts=1
